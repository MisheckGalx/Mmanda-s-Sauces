AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mmanda's Sauces - Quickstart static site infra (S3 + CloudFront, OAC-secured)
  with a custom domain (demo.mmandas.com) and ACM certificate attached.

Parameters:
  DomainName:
    Type: String
    Default: demo.mmandas.com
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:900429455393:certificate/d508c48b-d929-4ded-9e85-7f9cd6da8869

Resources:

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mmandas-sauces-website-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: MmandasSauces

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: MmandasSauces-OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Mmanda's Sauces - static site (custom domain)

        Aliases:
          - !Ref DomainName

        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true

      Tags:
        - Key: Project
          Value: MmandasSauces

Outputs:
  S3BucketName:
    Description: Upload your built React app (client/dist) here
    Value: !Ref WebsiteBucket

  CloudFrontDomain:
    Description: CloudFront's own domain (use as CNAME target in your DNS)
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: Use this ID to invalidate cache after each deploy
    Value: !Ref CloudFrontDistribution

  WebsiteURL:
    Description: Live site URL on your custom domain
    Value: !Sub 'https://${DomainName}'