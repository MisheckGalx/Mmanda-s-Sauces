AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mmanda's Sauces - SSL Fix
  Proper architecture: S3 (static site) + ACM (free SSL) + CloudFront (HTTPS CDN)
  This REPLACES the broken Global Accelerator -> EC2 setup.

Parameters:
  DomainName:
    Type: String
    Default: mmandas.com
    Description: Your primary domain name

  WWWDomainName:
    Type: String
    Default: www.mmandas.com
    Description: WWW subdomain

  # NOTE: ACM cert for CloudFront MUST be in us-east-1
  # Run this stack in us-east-1 OR use the manual cert ARN below
  CertificateArn:
    Type: String
    Description: >
      ARN of ACM certificate in us-east-1.
      If blank, you must request one manually (see deploy guide).
    Default: ''

Resources:

  # ─────────────────────────────────────────────
  # S3 Bucket - Static Website Hosting
  # ─────────────────────────────────────────────
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mmandas-sauces-website-${AWS::AccountId}'
      # Block all public access - CloudFront uses OAC instead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: MmandasSauces
        - Key: Environment
          Value: Production

  # ─────────────────────────────────────────────
  # CloudFront Origin Access Control (OAC)
  # Secure: only CloudFront can read from S3
  # ─────────────────────────────────────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: MmandasSauces-OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ─────────────────────────────────────────────
  # S3 Bucket Policy - Allow only CloudFront OAC
  # ─────────────────────────────────────────────
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ─────────────────────────────────────────────
  # CloudFront Distribution
  # This handles: HTTPS, SSL cert, global CDN, SPA routing
  # ─────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Mmanda's Sauces - Production CDN

        # Custom domain names
        Aliases:
          - !Ref DomainName
          - !Ref WWWDomainName

        # Free SSL certificate via ACM
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021   # Modern TLS only

        # S3 as the origin
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''  # Empty because we use OAC not OAI

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https  # Always force HTTPS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true

        # React SPA: redirect all 404s to index.html for client-side routing
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true

        # Cache static assets aggressively, HTML not at all
        CacheBehaviors:
          - PathPattern: '*.js'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '*.css'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '/images/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true

      Tags:
        - Key: Project
          Value: MmandasSauces

Outputs:
  S3BucketName:
    Description: Upload your built React app here
    Value: !Ref WebsiteBucket
    Export:
      Name: MmandasSauces-BucketName

  CloudFrontDomain:
    Description: CloudFront domain (use this in Route 53 alias record)
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: MmandasSauces-CloudFrontDomain

  CloudFrontDistributionId:
    Description: Use this ID to invalidate cache after deployments
    Value: !Ref CloudFrontDistribution
    Export:
      Name: MmandasSauces-DistributionId

  WebsiteURL:
    Description: Live website URL
    Value: !Sub 'https://${DomainName}'
